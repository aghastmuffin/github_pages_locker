<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private GH Loader</title>
    <style>
        :root {
            color-scheme: light;
            --bg: radial-gradient(circle at 15% 20%, #f3f5ff 0%, #eef8ff 32%, #fffef8 100%);
            --surface: #ffffffcc;
            --stroke: #d7dce8;
            --text: #132033;
            --muted: #4d607a;
            --primary: #0a6b7a;
            --danger: #9f1f31;
            --ok: #17662f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Avenir Next", "Segoe UI", sans-serif;
            color: var(--text);
            background: var(--bg);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .panel {
            width: min(640px, 100%);
            border: 1px solid var(--stroke);
            background: var(--surface);
            border-radius: 16px;
            box-shadow: 0 12px 42px #1f2f5540;
            backdrop-filter: blur(8px);
            padding: 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.3rem;
        }

        p {
            margin: 0 0 14px;
            color: var(--muted);
            line-height: 1.4;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        input,
        button {
            font: inherit;
            border-radius: 10px;
            border: 1px solid var(--stroke);
            padding: 10px 12px;
        }

        button {
            background: var(--primary);
            color: white;
            cursor: pointer;
            border-color: #0c5b68;
            min-width: 120px;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.75;
        }

        .status {
            margin-top: 14px;
            border-radius: 10px;
            border: 1px dashed var(--stroke);
            padding: 10px 12px;
            background: #fff;
            min-height: 44px;
            font-size: 0.95rem;
        }

        .status.error {
            border-color: #e3a3ac;
            color: var(--danger);
        }

        .status.ok {
            border-color: #99cfad;
            color: var(--ok);
        }

        .remember-row {
            margin-top: 10px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .remember-row label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
    </style>
    <script src="encrypted/runtime-config.js"></script>
</head>
<body>
    <main class="panel" id="unlockPanel">
        <h1>Project Name</h1>
        <p>Description</p>
        <div class="row">
            <input id="pass" type="password" autocomplete="current-password" placeholder="Enter passphrase" />
            <button id="unlockBtn">Unlock</button>
        </div>
        <div class="remember-row">
            <label for="rememberPass">
                <input id="rememberPass" type="checkbox" checked />
                <span>Remember passcode on this browser (30 days)</span>
            </label>
        </div>
        <div class="status" id="status">Awaiting unlock.</div>
    </main>

    <script>
        (() => {
            "use strict";

            const OP_DEFINE_FILE = 0x01;
            const PASSCODE_STORAGE_KEY = "PRIVATE_GH_PASSCODE_V1";
            const PASSCODE_TTL_MS = 30 * 24 * 60 * 60 * 1000;
            const DEBUG_GUARD_INTERVAL_MS = 1200;
            const ENABLE_SESSION_CLEANUP_ON_LEAVE = true;
            const SESSION_CLEANUP_STORAGE_KEY = "PRIVATE_GH_LAST_SESSION_CLEANUP_V1";
            const SESSION_ID_RE = /^[A-Z0-9]{3}$/;
            const te = new TextEncoder();
            const td = new TextDecoder();
            const nativeFetch = window.fetch.bind(window);
            const wasmBytes = new Uint8Array([
                0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00,
                0x01, 0x06, 0x01, 0x60, 0x01, 0x7f, 0x01, 0x7f,
                0x03, 0x02, 0x01, 0x00,
                0x07, 0x0a, 0x01, 0x06, 0x61, 0x63, 0x63, 0x65, 0x70, 0x74, 0x00, 0x00,
                0x0a, 0x06, 0x01, 0x04, 0x00, 0x20, 0x00, 0x0b
            ]);

            const state = {
                manifest: null,
                partA: "",
                partB: null,
                vmFiles: new Map(),
                loadedFragments: new Set(),
                wasm: null,
                entryPath: "",
                networkShimInstalled: false,
                assetElementShimInstalled: false,
                assetBlobUrls: new Map(),
                assetBlobPromises: new Map(),
                assetRewriteVersion: new WeakMap(),
                nativeFetch,
                locked: false,
                debugGuardTimer: null,
                navBridgeInstalled: false,
                sessionCleanupInstalled: false,
                cleanupSessionId: "",
                cleanupSupabaseOrigin: "",
                cleanupApiKey: "",
                cleanupAuthHeader: "",
                cleanupSignalSent: false,
            };

            const passEl = document.getElementById("pass");
            const rememberPassEl = document.getElementById("rememberPass");
            const unlockBtn = document.getElementById("unlockBtn");
            const statusEl = document.getElementById("status");

            function setStatus(msg, cls = "") {
                statusEl.textContent = (msg && String(msg).trim()) || "Unlock failed. Please try again.";
                statusEl.className = `status ${cls}`.trim();
            }

            function b64FromU8(bytes) {
                let raw = "";
                for (let i = 0; i < bytes.length; i += 1) {
                    raw += String.fromCharCode(bytes[i]);
                }
                return btoa(raw);
            }

            function u8FromB64(input) {
                const raw = atob(input);
                const out = new Uint8Array(raw.length);
                for (let i = 0; i < raw.length; i += 1) {
                    out[i] = raw.charCodeAt(i);
                }
                return out;
            }

            function savePasscode(passcode) {
                try {
                    const envelope = {
                        v: 1,
                        passcode,
                        expiresAt: Date.now() + PASSCODE_TTL_MS,
                    };
                    const serialized = JSON.stringify(envelope);
                    const encoded = b64FromU8(te.encode(serialized));
                    localStorage.setItem(PASSCODE_STORAGE_KEY, encoded);
                } catch {
                    // Best effort only.
                }
            }

            function clearSavedPasscode() {
                try {
                    localStorage.removeItem(PASSCODE_STORAGE_KEY);
                } catch {
                    // Best effort only.
                }
            }

            function loadSavedPasscode() {
                try {
                    const encoded = localStorage.getItem(PASSCODE_STORAGE_KEY);
                    if (!encoded) {
                        return "";
                    }

                    const decoded = td.decode(u8FromB64(encoded));
                    const payload = JSON.parse(decoded);
                    if (!payload || typeof payload.passcode !== "string" || typeof payload.expiresAt !== "number") {
                        clearSavedPasscode();
                        return "";
                    }

                    if (Date.now() > payload.expiresAt) {
                        clearSavedPasscode();
                        return "";
                    }

                    return payload.passcode;
                } catch {
                    clearSavedPasscode();
                    return "";
                }
            }

            function normalizeUnlockError(error) {
                if (error instanceof DOMException && error.name === "OperationError") {
                    return "Incorrect passphrase. Please try again.";
                }

                const rawMessage = error instanceof Error
                    ? (error.message || "")
                    : String(error || "");
                const message = rawMessage.trim();

                if (!message) {
                    return "Incorrect passphrase. Please try again.";
                }

                if (/operationerror|decrypt|decryption failed|authentication/i.test(message)) {
                    return "Incorrect passphrase. Please try again.";
                }

                return message;
            }

            function clearDebugGuard() {
                if (state.debugGuardTimer !== null) {
                    clearInterval(state.debugGuardTimer);
                    state.debugGuardTimer = null;
                }
            }

            function lockRuntime(reason) {
                if (state.locked) {
                    return;
                }

                state.locked = true;
                clearDebugGuard();
                state.manifest = null;
                state.partA = "";
                state.partB = null;
                state.entryPath = "";
                state.vmFiles.clear();
                state.loadedFragments.clear();
                for (const blobUrl of state.assetBlobUrls.values()) {
                    URL.revokeObjectURL(blobUrl);
                }
                state.assetBlobUrls.clear();
                state.assetBlobPromises.clear();
                state.assetRewriteVersion = new WeakMap();
                window.fetch = state.nativeFetch;

                clearSavedPasscode();
                if (rememberPassEl) {
                    rememberPassEl.checked = false;
                }
                passEl.value = "";
                passEl.disabled = true;
                unlockBtn.disabled = true;
                setStatus(reason || "Runtime locked due to analysis detection.", "error");
            }

            function ensureUnlocked() {
                if (state.locked) {
                    throw new Error("Runtime locked due to analysis detection.");
                }
            }

            function startDebugGuard() {
                clearDebugGuard();
                state.debugGuardTimer = setInterval(() => {
                    if (antiAnalysisTriggered()) {
                        lockRuntime("Debugging detected. Runtime locked.");
                    }
                }, DEBUG_GUARD_INTERVAL_MS);
            }

            function concatBytes(...arrays) {
                const total = arrays.reduce((sum, arr) => sum + arr.length, 0);
                const out = new Uint8Array(total);
                let cursor = 0;
                for (const arr of arrays) {
                    out.set(arr, cursor);
                    cursor += arr.length;
                }
                return out;
            }

            function stableStringify(value) {
                if (value === null || typeof value !== "object") {
                    return JSON.stringify(value);
                }

                if (Array.isArray(value)) {
                    return `[${value.map((item) => stableStringify(item)).join(",")}]`;
                }

                const keys = Object.keys(value).sort();
                const body = keys
                    .map((key) => `${JSON.stringify(key)}:${stableStringify(value[key])}`)
                    .join(",");
                return `{${body}}`;
            }

            async function sha256Hex(data) {
                const hash = await crypto.subtle.digest("SHA-256", data);
                const bytes = new Uint8Array(hash);
                return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");
            }

            async function derivePartB(password, saltB64, iterations) {
                const keyMaterial = await crypto.subtle.importKey(
                    "raw",
                    te.encode(password),
                    "PBKDF2",
                    false,
                    ["deriveBits"]
                );
                const bits = await crypto.subtle.deriveBits(
                    {
                        name: "PBKDF2",
                        hash: "SHA-256",
                        salt: u8FromB64(saltB64),
                        iterations,
                    },
                    keyMaterial,
                    256
                );
                return new Uint8Array(bits);
            }

            async function deriveSplitKey(partA, partB, partC) {
                const joined = concatBytes(te.encode(partA), partB, partC);
                const digest = await crypto.subtle.digest("SHA-256", joined);
                return new Uint8Array(digest);
            }

            async function initWasm() {
                try {
                    const result = await WebAssembly.instantiate(wasmBytes);
                    state.wasm = result.instance.exports;
                } catch {
                    state.wasm = null;
                }
            }

            function antiAnalysisTriggered() {
                const widthGap = window.outerWidth - window.innerWidth;
                const heightGap = window.outerHeight - window.innerHeight;
                const geometryLooksLikeDevtools = widthGap > 170 || heightGap > 170;

                const t0 = performance.now();
                debugger;
                const dt = performance.now() - t0;
                const breakpointLatency = dt > 140;

                return geometryLooksLikeDevtools && breakpointLatency;
            }

            async function loadManifest(manifestPath) {
                ensureUnlocked();
                const response = await fetch(manifestPath, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`Manifest fetch failed (${response.status})`);
                }
                const manifest = await response.json();

                const expectedHash = manifest.manifest_hash;
                if (typeof expectedHash !== "string" || expectedHash.length !== 64) {
                    throw new Error("Invalid manifest integrity metadata.");
                }

                const copy = typeof structuredClone === "function"
                    ? structuredClone(manifest)
                    : JSON.parse(JSON.stringify(manifest));
                delete copy.manifest_hash;
                const canonical = te.encode(stableStringify(copy));
                const actualHash = await sha256Hex(canonical);
                if (actualHash !== expectedHash) {
                    throw new Error("Manifest integrity check failed.");
                }

                state.manifest = manifest;
            }

            async function decryptFragment(fragmentPath) {
                ensureUnlocked();
                const response = await fetch(fragmentPath, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`Fragment fetch failed (${response.status})`);
                }

                const envelope = await response.json();
                const partC = u8FromB64(envelope.partC_b64);
                const nonce = u8FromB64(envelope.nonce_b64);
                const ciphertext = u8FromB64(envelope.ciphertext_b64);

                const keyRaw = await deriveSplitKey(state.partA, state.partB, partC);
                const cryptoKey = await crypto.subtle.importKey(
                    "raw",
                    keyRaw,
                    { name: "AES-GCM" },
                    false,
                    ["decrypt"]
                );

                const plainBuffer = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: nonce },
                    cryptoKey,
                    ciphertext
                );

                const plainBytes = new Uint8Array(plainBuffer);
                const bytecodeHash = await sha256Hex(plainBytes);
                if (bytecodeHash !== envelope.bytecode_sha256) {
                    throw new Error("Bytecode checksum mismatch.");
                }

                return plainBytes;
            }

            function readU16(bytes, cursor) {
                return (bytes[cursor] << 8) | bytes[cursor + 1];
            }

            function readU32(bytes, cursor) {
                return (
                    (bytes[cursor] << 24) |
                    (bytes[cursor + 1] << 16) |
                    (bytes[cursor + 2] << 8) |
                    bytes[cursor + 3]
                ) >>> 0;
            }

            function executeBytecode(bytecode) {
                let cursor = 0;
                while (cursor < bytecode.length) {
                    const opcode = bytecode[cursor];
                    cursor += 1;

                    if (state.wasm && typeof state.wasm.accept === "function") {
                        const accepted = state.wasm.accept(opcode);
                        if (accepted !== opcode) {
                            throw new Error("WASM opcode gate rejected the instruction.");
                        }
                    }

                    if (opcode !== OP_DEFINE_FILE) {
                        throw new Error(`Unsupported opcode ${opcode}`);
                    }

                    const pathLen = readU16(bytecode, cursor);
                    cursor += 2;

                    const pathBytes = bytecode.slice(cursor, cursor + pathLen);
                    cursor += pathLen;
                    const logicalPath = td.decode(pathBytes);

                    const mimeLen = readU16(bytecode, cursor);
                    cursor += 2;

                    const mimeBytes = bytecode.slice(cursor, cursor + mimeLen);
                    cursor += mimeLen;
                    const mime = td.decode(mimeBytes);

                    const dataLen = readU32(bytecode, cursor);
                    cursor += 4;

                    const data = bytecode.slice(cursor, cursor + dataLen);
                    cursor += dataLen;

                    state.vmFiles.set(logicalPath, { mime, data });
                }
            }

            async function fetchLogicalFile(logicalPath) {
                ensureUnlocked();
                // Normalize: strip leading "./" so paths like "./images/foo.png" resolve
                // to the same manifest key as "images/foo.png".
                const key = logicalPath.replace(/^(\.\/)+/, "");

                const existing = state.vmFiles.get(key) || state.vmFiles.get(logicalPath);
                if (existing) {
                    return existing;
                }

                const fileMeta = state.manifest.files[key] || state.manifest.files[logicalPath];
                if (!fileMeta) {
                    throw new Error(`Protected file not found: ${key}`);
                }

                if (!state.loadedFragments.has(fileMeta.fragment)) {
                    const bytecode = await decryptFragment(fileMeta.fragment);
                    executeBytecode(bytecode);
                    state.loadedFragments.add(fileMeta.fragment);
                }

                const loaded = state.vmFiles.get(key) || state.vmFiles.get(logicalPath);
                if (!loaded) {
                    throw new Error(`Fragment did not define requested file: ${key}`);
                }
                return loaded;
            }

            function isExternalReference(input) {
                return /^(?:https?:|data:|blob:|\/\/|#|mailto:|tel:)/i.test(input);
            }

            function resolvePath(basePath, target) {
                const clean = target.split("#")[0].split("?")[0];
                if (clean.startsWith("/")) {
                    return clean.slice(1);
                }

                const baseDir = basePath.includes("/") ? basePath.slice(0, basePath.lastIndexOf("/") + 1) : "";
                const joined = new URL(clean, `https://private.local/${baseDir}`).pathname;
                return joined.startsWith("/") ? joined.slice(1) : joined;
            }

            function buildRuntimeUrl(logicalPath) {
                return `${window.location.pathname}#~${encodeURIComponent(logicalPath)}`;
            }

            function readRoutePathFromHash() {
                const hash = window.location.hash || "";
                if (!hash.startsWith("#~")) {
                    return "";
                }

                try {
                    return decodeURIComponent(hash.slice(2));
                } catch {
                    return "";
                }
            }

            function isHtmlMime(mime) {
                return typeof mime === "string" && /^text\/html\b/i.test(mime);
            }

            function getPathDir(path) {
                return path.includes("/") ? path.slice(0, path.lastIndexOf("/") + 1) : "";
            }

            function toAbsoluteUrl(raw) {
                try {
                    return new URL(raw, window.location.href);
                } catch {
                    return null;
                }
            }

            function getRequestMethod(input, init) {
                const method = init?.method || (input instanceof Request ? input.method : "GET");
                return String(method || "GET").toUpperCase();
            }

            function getHeaderValueFromContainer(headers, targetName) {
                if (!headers) {
                    return "";
                }

                const name = String(targetName || "").toLowerCase();
                if (!name) {
                    return "";
                }

                if (headers instanceof Headers) {
                    return String(headers.get(name) || "").trim();
                }

                if (Array.isArray(headers)) {
                    for (const pair of headers) {
                        if (!Array.isArray(pair) || pair.length < 2) {
                            continue;
                        }
                        if (String(pair[0]).toLowerCase() === name) {
                            return String(pair[1] || "").trim();
                        }
                    }
                    return "";
                }

                if (typeof headers === "object") {
                    for (const [key, value] of Object.entries(headers)) {
                        if (String(key).toLowerCase() === name) {
                            return String(value || "").trim();
                        }
                    }
                }

                return "";
            }

            function getHeaderValue(input, init, name) {
                const target = String(name || "").toLowerCase();
                const fromInit = getHeaderValueFromContainer(init?.headers || null, target);
                if (fromInit) {
                    return fromInit;
                }

                if (input instanceof Request) {
                    return String(input.headers.get(target) || "").trim();
                }

                return "";
            }

            function toAbsoluteRequestUrl(input) {
                try {
                    if (input instanceof Request) {
                        return new URL(input.url, window.location.href);
                    }

                    if (input instanceof URL) {
                        return input;
                    }

                    if (typeof input === "string") {
                        return new URL(input, window.location.href);
                    }

                    if (input && typeof input.url === "string") {
                        return new URL(input.url, window.location.href);
                    }
                } catch {
                    return null;
                }

                return null;
            }

            function persistCleanupState() {
                try {
                    const payload = {
                        sessionId: state.cleanupSessionId,
                        supabaseOrigin: state.cleanupSupabaseOrigin,
                        apikey: state.cleanupApiKey,
                        authHeader: state.cleanupAuthHeader,
                    };
                    sessionStorage.setItem(SESSION_CLEANUP_STORAGE_KEY, JSON.stringify(payload));
                } catch {
                    // Best effort only.
                }
            }

            function hydrateCleanupState() {
                try {
                    const raw = sessionStorage.getItem(SESSION_CLEANUP_STORAGE_KEY);
                    if (!raw) {
                        return;
                    }

                    const parsed = JSON.parse(raw);
                    const sessionId = String(parsed?.sessionId || "").trim().toUpperCase();
                    const origin = String(parsed?.supabaseOrigin || "").trim();
                    const apikey = String(parsed?.apikey || "").trim();
                    const authHeader = String(parsed?.authHeader || "").trim();

                    if (!SESSION_ID_RE.test(sessionId)) {
                        return;
                    }

                    if (!origin || !apikey) {
                        return;
                    }

                    state.cleanupSessionId = sessionId;
                    state.cleanupSupabaseOrigin = origin;
                    state.cleanupApiKey = apikey;
                    state.cleanupAuthHeader = authHeader;
                    state.cleanupSignalSent = false;
                } catch {
                    // Best effort only.
                }
            }

            function maybeRememberEventsWrite(input, init, method) {
                if (!ENABLE_SESSION_CLEANUP_ON_LEAVE) {
                    return;
                }

                if (!(method === "POST" || method === "PUT" || method === "PATCH")) {
                    return;
                }

                const absoluteUrl = toAbsoluteRequestUrl(input);
                if (!absoluteUrl || !/\.supabase\.co$/i.test(absoluteUrl.hostname)) {
                    return;
                }

                if (!/^\/rest\/v1\/events\/?$/i.test(absoluteUrl.pathname)) {
                    return;
                }

                const body = init?.body;
                if (typeof body !== "string") {
                    return;
                }

                let payload;
                try {
                    payload = JSON.parse(body);
                } catch {
                    return;
                }

                const first = Array.isArray(payload) ? payload[0] : payload;
                if (!first || typeof first !== "object") {
                    return;
                }

                const sessionId = String(first.session_id || first.sessionId || "").trim().toUpperCase();
                if (!SESSION_ID_RE.test(sessionId)) {
                    return;
                }

                const apikey = getHeaderValue(input, init, "apikey");
                if (!apikey) {
                    return;
                }

                state.cleanupSessionId = sessionId;
                state.cleanupSupabaseOrigin = absoluteUrl.origin;
                state.cleanupApiKey = apikey;

                const authHeader = getHeaderValue(input, init, "authorization");
                if (authHeader) {
                    state.cleanupAuthHeader = authHeader;
                }

                state.cleanupSignalSent = false;
                persistCleanupState();
            }

            function sendSessionCleanupSignal(reason) {
                if (!ENABLE_SESSION_CLEANUP_ON_LEAVE) {
                    return;
                }

                if (state.cleanupSignalSent) {
                    return;
                }

                if (!SESSION_ID_RE.test(state.cleanupSessionId)) {
                    return;
                }

                if (!state.cleanupSupabaseOrigin || !state.cleanupApiKey) {
                    return;
                }

                state.cleanupSignalSent = true;
                const authHeader = state.cleanupAuthHeader || `Bearer ${state.cleanupApiKey}`;
                const deleteUrl = `${state.cleanupSupabaseOrigin}/rest/v1/events?session_id=eq.${encodeURIComponent(state.cleanupSessionId)}`;

                state.nativeFetch(deleteUrl, {
                    method: "DELETE",
                    keepalive: true,
                    headers: {
                        apikey: state.cleanupApiKey,
                        Authorization: authHeader,
                        Prefer: "return=minimal",
                        "X-Private-GH-Reason": String(reason || "leave"),
                    },
                }).catch(() => {
                    // Best effort only.
                });
            }

            function resolveManifestPathFromRequest(input) {
                if (!state.manifest || !state.manifest.files) {
                    return null;
                }

                const entryPath = state.entryPath || state.manifest.entry || "";
                const candidates = [];
                const addCandidate = (candidate) => {
                    if (!candidate) {
                        return;
                    }
                    const normalized = String(candidate).replace(/^\/+/, "");
                    if (normalized && !candidates.includes(normalized)) {
                        candidates.push(normalized);
                    }
                };

                let raw = "";
                if (typeof input === "string") {
                    raw = input;
                } else if (input instanceof URL) {
                    raw = input.toString();
                }

                if (raw && !isExternalReference(raw)) {
                    addCandidate(resolvePath(entryPath, raw));
                }

                let absolute = null;
                if (input instanceof Request) {
                    absolute = toAbsoluteUrl(input.url);
                } else if (raw) {
                    absolute = toAbsoluteUrl(raw);
                } else if (input && typeof input.url === "string") {
                    absolute = toAbsoluteUrl(input.url);
                }

                if (absolute && absolute.origin === window.location.origin) {
                    const fromPathname = absolute.pathname.replace(/^\/+/, "");
                    addCandidate(fromPathname);

                    const entryDir = getPathDir(entryPath);
                    if (entryDir && fromPathname && !fromPathname.startsWith(entryDir)) {
                        addCandidate(entryDir + fromPathname);
                    }
                }

                for (const candidate of candidates) {
                    if (Object.prototype.hasOwnProperty.call(state.manifest.files, candidate)) {
                        return candidate;
                    }
                }

                return null;
            }

            function resolveManifestPathFromRaw(rawValue) {
                if (!state.manifest || !state.manifest.files || !rawValue) {
                    return "";
                }

                const raw = String(rawValue || "").trim();
                if (!raw || isExternalReference(raw)) {
                    return "";
                }

                const fromRequest = resolveManifestPathFromRequest(raw);
                if (fromRequest) {
                    return fromRequest;
                }

                const entryPath = state.entryPath || state.manifest.entry || "";

                    "  var method = (form.getAttribute('method') || 'GET').toUpperCase();",
                    "  if (method !== 'GET') { return; }",
                    "  var action = form.getAttribute('action') || currentPath;",
                    "  var params = new URLSearchParams(new FormData(form));",
                    "  var targetUrl = action;",
                    "  var query = params.toString();",
                    "  if (query) { targetUrl = action + (action.indexOf('?') >= 0 ? '&' : '?') + query; }",
                    "  event.preventDefault();",
                    "  nav.navigateFromPage(targetUrl, currentPath).then(function(handled){",
                    "    if (!handled) { form.submit(); }",
                    "  }).catch(function(){});",
                    "}, true);",
                    "try {",
                    "  if (!window.__PRIVATE_GH_PATCHED_LOCATION_ASSIGN__) {",
                    "    window.__PRIVATE_GH_PATCHED_LOCATION_ASSIGN__ = true;",
                    "    var originalAssign = window.location.assign.bind(window.location);",
                    "    window.location.assign = function(url){",
                    "      nav.navigateFromPage(String(url || ''), currentPath).then(function(handled){",
                    "        if (!handled) { originalAssign(url); }",
                    "      }).catch(function(){ originalAssign(url); });",
                    "    };",
                    "  }",
                    "} catch (_) {}",
                    "try {",
                    "  if (!window.__PRIVATE_GH_PATCHED_LOCATION_REPLACE__) {",
                    "    window.__PRIVATE_GH_PATCHED_LOCATION_REPLACE__ = true;",
                    "    var originalReplace = window.location.replace.bind(window.location);",
                    "    window.location.replace = function(url){",
                    "      nav.navigateFromPage(String(url || ''), currentPath).then(function(handled){",
                    "        if (!handled) { originalReplace(url); }",
                    "      }).catch(function(){ originalReplace(url); });",
                    "    };",
                    "  }",
                    "} catch (_) {}",
                    "try {",
                    "  if (!window.__PRIVATE_GH_PATCHED_WINDOW_OPEN__) {",
                    "    window.__PRIVATE_GH_PATCHED_WINDOW_OPEN__ = true;",
                    "    var originalOpen = window.open.bind(window);",
                    "    window.open = function(url, target, features){",
                    "      var targetName = String(target || '').toLowerCase();",
                    "      if (!targetName || targetName === '_self') {",
                    "        nav.navigateFromPage(String(url || ''), currentPath).then(function(handled){",
                    "          if (!handled) { originalOpen(url, target, features); }",
                    "        }).catch(function(){ originalOpen(url, target, features); });",
                    "        return null;",
                    "      }",
                    "      return originalOpen(url, target, features);",
                    "    };",
                    "  }",
                    "} catch (_) {}",
                    "})();",
                ].join("\n");
            }

            async function renderProtectedPage(logicalPath, options = {}) {
                ensureUnlocked();
                const file = await fetchLogicalFile(logicalPath);
                if (!isHtmlMime(file.mime)) {
                    throw new Error(`Navigation target is not an HTML page: ${logicalPath}`);
                }

                const htmlText = td.decode(file.data);
                const rendered = await rewriteProtectedHtml(logicalPath, htmlText);

                state.entryPath = logicalPath;

                if (!options.skipHistory) {
                    const stateObj = { privateGhPath: logicalPath };
                    const url = buildRuntimeUrl(logicalPath);
                    if (options.replaceHistory) {
                        window.history.replaceState(stateObj, "", url);
                    } else {
                        window.history.pushState(stateObj, "", url);
                    }
                }

                document.open();
                document.write(rendered);
                document.close();
            }

            async function navigateToProtectedTarget(rawTarget, options = {}) {
                ensureUnlocked();
                const logicalPath = resolveNavigationTarget(rawTarget, options.fromPath || state.entryPath);
                if (!logicalPath) {
                    return false;
                }

                await renderProtectedPage(logicalPath, {
                    replaceHistory: Boolean(options.replaceHistory),
                    skipHistory: Boolean(options.skipHistory),
                });
                return true;
            }

            function installNavigationBridge() {
                if (state.navBridgeInstalled) {
                    return;
                }

                window.__PRIVATE_GH_NAV__ = {
                    navigate: (target, options = {}) => navigateToProtectedTarget(target, options),
                    navigateFromPage: (target, fromPath = "") => navigateToProtectedTarget(target, { fromPath }),
                };

                window.addEventListener("popstate", (event) => {
                    const pathFromState = event && event.state && typeof event.state.privateGhPath === "string"
                        ? event.state.privateGhPath
                        : "";
                    const target = pathFromState || readRoutePathFromHash();
                    if (!target || state.locked || !state.manifest) {
                        return;
                    }

                    navigateToProtectedTarget(target, {
                        fromPath: target,
                        replaceHistory: true,
                        skipHistory: true,
                    }).catch(() => {
                        // Ignore popstate navigation failures.
                    });
                });

                state.navBridgeInstalled = true;
            }

            function installSessionCleanupHooks() {
                if (state.sessionCleanupInstalled) {
                    return;
                }

                hydrateCleanupState();

                window.addEventListener("pagehide", () => {
                    sendSessionCleanupSignal("pagehide");
                });

                window.addEventListener("beforeunload", () => {
                    sendSessionCleanupSignal("beforeunload");
                });

                state.sessionCleanupInstalled = true;
            }

            function installNetworkShim() {
                if (state.networkShimInstalled) {
                    return;
                }

                window.fetch = async (input, init) => {
                    if (state.locked) {
                        throw new Error("Runtime locked due to analysis detection.");
                    }

                    const method = getRequestMethod(input, init);
                    maybeRememberEventsWrite(input, init, method);
                    if ((method === "GET" || method === "HEAD") && state.manifest) {
                        const logicalPath = resolveManifestPathFromRequest(input);
                        if (logicalPath) {
                            const file = await fetchLogicalFile(logicalPath);
                            const headers = new Headers({
                                "Content-Type": file.mime,
                                "X-Private-GH": "vm",
                            });

                            if (method === "HEAD") {
                                headers.set("Content-Length", String(file.data.length));
                                return new Response(null, { status: 200, headers });
                            }

                            return new Response(file.data.slice(0), { status: 200, headers });
                        }
                    }

                    return state.nativeFetch(input, init);
                };

                state.networkShimInstalled = true;
            }

            async function rewriteCssUrls(cssText, cssLogicalPath) {
                // Handles both quoted (allowing spaces/special chars) and unquoted url() values.
                const urlPattern = /url\(\s*(?:(['"])(.*?)\1|([^'"\)\s]+))\s*\)/gi;
                const items = [];
                let m;
                while ((m = urlPattern.exec(cssText)) !== null) {
                    const quote = m[1] || "";
                    const raw = m[2] !== undefined ? m[2] : m[3];
                    if (raw && !isExternalReference(raw)) {
                        items.push({ index: m.index, length: m[0].length, raw, quote });
                    }
                }
                if (!items.length) {
                    return cssText;
                }
                const blobUrls = await Promise.all(items.map(async ({ raw }) => {
                    try {
                        const assetPath = resolvePath(cssLogicalPath, raw);
                        const assetFile = await fetchLogicalFile(assetPath);
                        const blob = new Blob([assetFile.data], { type: assetFile.mime });
                        return URL.createObjectURL(blob);
                    } catch {
                        return null;
                    }
                }));
                let out = cssText;
                for (let i = items.length - 1; i >= 0; i--) {
                    if (blobUrls[i] === null) {
                        continue;
                    }
                    const { index, length, quote } = items[i];
                    out = out.slice(0, index) + `url(${quote}${blobUrls[i]}${quote})` + out.slice(index + length);
                }
                return out;
            }

            async function rewriteProtectedHtml(entryPath, htmlText) {
                ensureUnlocked();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, "text/html");
                const work = [];

                for (const script of doc.querySelectorAll("script[src]")) {
                    const src = script.getAttribute("src") || "";
                    if (!src || isExternalReference(src)) {
                        continue;
                    }

                    work.push((async () => {
                        const logicalPath = resolvePath(entryPath, src);
                        const file = await fetchLogicalFile(logicalPath);
                        const inline = doc.createElement("script");
                        if (script.type) {
                            inline.type = script.type;
                        }
                        const source = td.decode(file.data);
                        if ((script.type || "").toLowerCase() === "module") {
                            inline.textContent = source;
                        } else {
                            // Isolate local script lexical bindings so repeated protected renders do not collide.
                            inline.textContent = `(() => {\n${source}\n})();\n//# sourceURL=privategh/${logicalPath.replace(/\s+/g, "_")}`;
                        }
                        script.replaceWith(inline);
                    })());
                }

                for (const link of doc.querySelectorAll("link[rel='stylesheet'][href]")) {
                    const href = link.getAttribute("href") || "";
                    if (!href || isExternalReference(href)) {
                        continue;
                    }

                    work.push((async () => {
                        const logicalPath = resolvePath(entryPath, href);
                        const file = await fetchLogicalFile(logicalPath);
                        const style = doc.createElement("style");
                        style.textContent = await rewriteCssUrls(td.decode(file.data), logicalPath);
                        link.replaceWith(style);
                    })());
                }

                for (const el of doc.querySelectorAll("[style]")) {
                    const inlineStyle = el.getAttribute("style") || "";
                    if (!inlineStyle || !/url\(/i.test(inlineStyle)) {
                        continue;
                    }

                    work.push((async () => {
                        const rewritten = await rewriteCssUrls(inlineStyle, entryPath);
                        el.setAttribute("style", rewritten);
                    })());
                }

                for (const source of doc.querySelectorAll("source[srcset]")) {
                    const srcset = source.getAttribute("srcset") || "";
                    if (!srcset) {
                        continue;
                    }

                    work.push((async () => {
                        const rewritten = await rewriteSrcsetValueForRuntime(srcset, entryPath);
                        source.setAttribute("srcset", rewritten);
                    })());
                }

                for (const img of doc.querySelectorAll("img[srcset]")) {
                    const srcset = img.getAttribute("srcset") || "";
                    if (!srcset) {
                        continue;
                    }

                    work.push((async () => {
                        const rewritten = await rewriteSrcsetValueForRuntime(srcset, entryPath);
                        img.setAttribute("srcset", rewritten);
                    })());
                }

                for (const img of doc.querySelectorAll("img[src]")) {
                    const src = img.getAttribute("src") || "";
                    if (!src || isExternalReference(src)) {
                        continue;
                    }

                    work.push((async () => {
                        const logicalPath = resolvePath(entryPath, src);
                        const file = await fetchLogicalFile(logicalPath);
                        const blob = new Blob([file.data], { type: file.mime });
                        img.setAttribute("loading", "lazy");
                        img.src = URL.createObjectURL(blob);
                    })());
                }

                await Promise.all(work);

                const bridgeScript = doc.createElement("script");
                bridgeScript.textContent = buildNavigationBridgeScript(entryPath);
                if (doc.body) {
                    doc.body.appendChild(bridgeScript);
                } else if (doc.documentElement) {
                    doc.documentElement.appendChild(bridgeScript);
                }

                return "<!doctype html>\n" + doc.documentElement.outerHTML;
            }

            async function unlock() {
                ensureUnlocked();
                const runtime = window.__PRIVATE_GH_RUNTIME__;
                if (!runtime || typeof runtime.partA !== "string" || typeof runtime.manifest !== "string") {
                    throw new Error("Missing runtime-config.js or invalid runtime configuration.");
                }

                if (antiAnalysisTriggered()) {
                    lockRuntime("Debugging detected. Runtime locked.");
                    throw new Error("Runtime locked due to analysis detection.");
                    window.location.reload();
                }

                const password = passEl.value;
                if (!password) {
                    throw new Error("Passphrase is required.");
                }

                state.partA = runtime.partA;
                await loadManifest(runtime.manifest);

                const kdf = state.manifest.kdf || {};
                state.partB = await derivePartB(password, kdf.salt_b64, kdf.iterations);
                state.entryPath = state.manifest.entry || "";
                installNetworkShim();
                installAssetElementShim();
                installNavigationBridge();
                installSessionCleanupHooks();
                startDebugGuard();

                const hashTarget = readRoutePathFromHash();
                const initialTarget = resolveNavigationTarget(hashTarget, state.entryPath) || state.entryPath;

                if (rememberPassEl && rememberPassEl.checked) {
                    savePasscode(password);
                } else {
                    clearSavedPasscode();
                }

                setStatus("Unlocked. Handing control to protected runtime...", "ok");
                setTimeout(() => {
                    renderProtectedPage(initialTarget, {
                        replaceHistory: true,
                    }).catch((error) => {
                        const message = normalizeUnlockError(error);
                        setStatus(message, "error");
                        unlockBtn.disabled = false;
                    });
                }, 60);
            }

            async function init() {
                await initWasm();
                if (!window.isSecureContext) {
                    setStatus("Warning: crypto features are strongest on HTTPS origins.");
                }

                const saved = loadSavedPasscode();
                if (saved) {
                    passEl.value = saved;
                    if (rememberPassEl) {
                        rememberPassEl.checked = true;
                    }
                }

                unlockBtn.disabled = false;
            }

            unlockBtn.disabled = true;
            unlockBtn.addEventListener("click", async () => {
                if (state.locked) {
                    setStatus("Runtime locked due to analysis detection.", "error");
                    return;
                }

                unlockBtn.disabled = true;
                setStatus("Deriving keys and loading encrypted bytecode...");
                try {
                    await unlock();
                } catch (error) {
                    const message = normalizeUnlockError(error);
                    setStatus(message, "error");
                    unlockBtn.disabled = false;
                }
            });

            passEl.addEventListener("keydown", (event) => {
                if (event.key === "Enter" && !unlockBtn.disabled) {
                    unlockBtn.click();
                }
            });

            init().catch(() => {
                setStatus("Loader initialization failed.", "error");
                unlockBtn.disabled = true;
            });
        })();
    </script>
